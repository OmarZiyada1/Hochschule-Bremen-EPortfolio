# Gemeinsame Grundlage aller drei Betriebsarten.
#
# Der Dateiname ist mit Absicht keiner, den Compose von allein findet:
# "docker compose up" ohne -f soll mit "no configuration file" abbrechen und
# nicht eine halb konfigurierte Mischung starten. Jede Betriebsart nennt ihre
# Dateien ausdruecklich:
#
#   docker compose -f compose.base.yml -f compose.dev.yml      up -d
#   docker compose -f compose.base.yml -f compose.artifact.yml up -d
#   docker compose -f compose.base.yml -f compose.prod.yml     up -d
#
# Hier steht nur, was in allen drei gleich ist. Alles, was sich unterscheidet,
# steht in genau einer Overlay-Datei: Projektname, Ports, Bau-Stufe,
# Spring-Profil, Volumes. Wer wissen will, was eine Betriebsart ausmacht,
# liest eine Datei und nicht drei.
#
# Bewusst NICHT hier:
#   - "name": setzt jedes Overlay selbst, damit die drei Betriebsarten in
#     getrennten Compose-Projekten liegen und nebeneinander laufen koennen.
#   - "ports": die Host-Ports unterscheiden sich je Betriebsart, sonst
#     koennten sie nicht gleichzeitig laufen.
#   - "container_name": Compose benennt die Container von allein nach dem
#     Projekt (etwa eportfolio-dev-backend-1). Ein fester Name waere in drei
#     Projekten doppelt vergeben.
#   - "SPRING_PROFILES_ACTIVE" und die Fremddienst-Werte: das ist der
#     eigentliche Unterschied zwischen ARTIFACT und PROD.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt - .env aus .env.example anlegen}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt - .env aus .env.example anlegen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - .env aus .env.example anlegen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Postgres ist erst nach der Initialisierung ansprechbar. Ohne diese
      # Pruefung startet das Backend zu frueh und scheitert an Flyway.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    # Der Name, unter dem dieses Image in der Registry liegt (KAN-101).
    #
    # DER SCHLUESSEL STEHT NEBEN "build", NICHT STATT DESSEN. Lokal baut
    # Compose weiterhin und vergibt dabei genau diesen Namen; auf dem Server
    # wird nur noch gezogen ("pull" und "up -d --no-build"), und ohne einen
    # image-Schluessel wuesste Compose dort nicht, was es ziehen soll.
    #
    # WARUM DER VORGABEWERT "local" HEISST UND NICHT "latest". Unter diesem
    # Namen liegt nach einem lokalen Bau das Ergebnis DIESES Rechners, und das
    # ist etwas anderes als der Stand, den die Action nach GHCR schiebt. Ein
    # ":latest" behauptete das Gegenteil. Gezogen wird ohnehin nie mit dem
    # Vorgabewert: der Deploy-Schritt setzt IMAGE_TAG in der .env auf
    # sha-<kurzer commit-hash>, und genau darueber laeuft auch ein Rollback.
    #
    # IMAGE_TAG liest COMPOSE aus der .env, nicht die Anwendung. Der Hinweis
    # aus Contract §6.8, dass eine .env den Container im Profil prod nicht von
    # selbst erreicht, greift hier also nicht: der Wert wird beim Ersetzen
    # dieser Zeile gebraucht und nicht im Prozess.
    #
    # WER DEN NAMENSRAUM AENDERT, AENDERT IHN AN VIER STELLEN: hier, beim
    # Dienst frontend darunter, in compose.dev.yml und in
    # .github/workflows/deploy.yml (dort unter IMAGE_NAMESPACE). Die Action
    # schiebt sonst woanders hin, als der Server zieht, und der Fehler faellt
    # erst beim Ausrollen auf.
    image: ghcr.io/omarziyada1/eportfolio-backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Fest verdrahtet und nicht aus der .env: dort steht POSTGRES_HOST auf
      # localhost (fuer den Start aus der IDE), und POSTGRES_PORT ist der auf
      # dem Host veroeffentlichte Port. Im Compose-Netz gilt immer db:5432.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt - .env aus .env.example anlegen}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt - .env aus .env.example anlegen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - .env aus .env.example anlegen}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt - .env aus .env.example anlegen}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  frontend:
    # Siehe die Begruendung beim Dienst backend (KAN-101).
    image: ghcr.io/omarziyada1/eportfolio-frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      # Die Angaben des Impressums (KAN-100).
      #
      # Sie stehen hier und nicht in den Sprachdateien, weil dieses
      # Repository oeffentlich auf GitHub liegt und eine ladungsfaehige
      # Privatanschrift dort auch nach dem Herausnehmen in der Historie
      # bliebe. Wie jeder andere Betriebswert kommen sie aus der .env.
      #
      # Warum in der Basis und nicht im prod-Overlay: sie gehoeren zur
      # BAU-Definition, und die ist in allen Betriebsarten dieselbe. DEV
      # baut kein dist/ und laesst sie damit von selbst liegen;
      # ARTIFACT-DEV baut dieselbe Stufe runtime wie PROD und soll das
      # Impressum genauso zeigen, sonst faellt eine leere Seite erst im
      # Betrieb auf.
      #
      # Der leere Default ist Absicht. Ohne ihn bricht der Bau ab, sobald
      # jemand ohne diese Werte baut; mit ihm sagt das Impressum sichtbar,
      # dass die Angaben fehlen, und erfindet keine Anschrift.
      args:
        VITE_IMPRINT_OPERATOR: ${VITE_IMPRINT_OPERATOR:-}
        VITE_IMPRINT_STREET: ${VITE_IMPRINT_STREET:-}
        VITE_IMPRINT_CITY: ${VITE_IMPRINT_CITY:-}
        VITE_IMPRINT_EMAIL: ${VITE_IMPRINT_EMAIL:-}
    depends_on:
      - backend

volumes:
  pgdata:
