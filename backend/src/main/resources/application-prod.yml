# Betriebsprofil (KAN-50, API-Contract §6.8).
#
# Grundsatz dieser Datei: sie enthaelt keinen einzigen Wert, nur Verweise auf
# die Umgebung. Jeder Platzhalter steht bewusst OHNE Default-Teil, also
# ${POSTGRES_HOST} und nicht ${POSTGRES_HOST:localhost}. Ein Default waere hier
# doppelt schaedlich: bei einem Geheimnis waere er ein eingecheckter Zugang, bei
# einer Adresse liesse er die Anwendung im Betrieb still gegen die falsche
# Gegenstelle laufen. Ohne Default scheitert stattdessen der Start und nennt den
# fehlenden Schluessel.
#
# Bewusst NICHT hier: spring.config.import fuer eine .env. Im Betrieb kommen die
# Werte aus der Umgebung des Prozesses, nicht aus einer Datei neben der
# Anwendung.
#
# Alle Schluessel sind in .env.example aufgefuehrt; dass die Liste vollstaendig
# bleibt, prueft ConfigurationPlaceholderTest.

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  # Verbindung zum SMTP-Relay (KAN-51). Steht unter spring.mail.* und nicht
  # unter app.mail.*, weil sie die Autokonfiguration von Spring bedient; app.mail
  # traegt die anwendungsseitigen Werte (Absender, Basis-URL, Auswahl des
  # Adapters). Nur hier und nicht in application.yml: im Profil dev laeuft der
  # Log-Adapter, dort liest diese Werte niemand.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          # Verschluesselung ab dem ersten Befehl erzwingen. Ohne diesen
          # Schalter versendet JavaMail im Klartext, sobald das Relay STARTTLS
          # nicht von sich aus verlangt, und die Zugangsdaten gingen unverpackt
          # ueber die Leitung.
          starttls:
            enable: true
            required: true
          # JavaMail wartet ohne diese drei Werte unbegrenzt. Das trifft nicht
          # nur den Versand: weil spring.mail.host gesetzt ist, legt Spring Boot
          # von allein eine Gesundheitspruefung fuer den Mailserver an, und die
          # oeffnet bei jedem Aufruf von /actuator/health eine SMTP-Verbindung.
          # Ist das Relay nicht erreichbar, antwortet der Endpunkt dann gar
          # nicht mehr, der Docker-Healthcheck laeuft in seinen Timeout und der
          # Container gilt als unhealthy, obwohl die Anwendung laeuft. Mit
          # Timeout meldet die Pruefung nach fuenf Sekunden DOWN und nennt den
          # Grund; das ist die Auskunft, die man haben will.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  security:
    cors:
      # Kein Default: im Betrieb ist der Vite-Dev-Server aus der
      # Basiskonfiguration die falsche Antwort.
      allowed-origins: ${CORS_ALLOWED_ORIGINS}

  storage:
    # Azure Blob Storage (§3.15.1, Contract v21). Die Verbindungszeichenfolge
    # traegt Endpoint, Kontoname und Kontoschluessel in einem Wert und ist
    # damit ein Geheimnis; sie steht nur hier als Platzhalter und sonst
    # nirgends im Repository.
    provider: azure
    container: ${AZURE_STORAGE_CONTAINER}
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}

  mail:
    # Versand ueber ein SMTP-Relay. Host, Port und Zugangsdaten gehoeren unter
    # spring.mail.* und kommen mit dem Adapter in KAN-51 dazu; ohne Adapter
    # gaebe es hier nichts, was sie liest.
    provider: smtp
    # Muss zur Domain des Relays passen, sonst weist es die Nachricht ab oder
    # sie landet im Spamordner.
    from-address: ${MAIL_FROM_ADDRESS}
    # Basis der Links in Verifizierungs- und Ruecksetzmails: die oeffentliche
    # Adresse des Frontends.
    base-url: ${APP_BASE_URL}
