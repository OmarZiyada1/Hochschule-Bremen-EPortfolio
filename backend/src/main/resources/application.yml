spring:
  profiles:
    # Ohne explizites SPRING_PROFILES_ACTIVE laeuft die Anwendung im dev-Profil.
    default: dev
  servlet:
    # Schranke des Multipart-Filters (KAN-23, angehoben mit KAN-72). Bewusst
    # OBERHALB des groessten fachlichen Limits aus §3.15, seit Contract v51
    # 200 MB fuer Video: stuende der Wert darunter, griffe er vor dem
    # Controller und die Antwort waere nicht das Envelope aus §6.2. So prueft
    # der FileService die fachlichen Limits selbst, und der Filter faengt nur
    # ab, was ohnehin niemals zulaessig waere. Seine
    # MaxUploadSizeExceededException bildet der GlobalExceptionHandler auf
    # 400 FILE_TOO_LARGE ab, dieselbe Antwort wie bei der fachlichen
    # Pruefung. max-request-size liegt darueber, weil neben der Datei noch
    # Grenzmarken und das Feld projectId im Koerper stehen.
    multipart:
      max-file-size: 210MB
      max-request-size: 212MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Paginierung nach API-Contract §1: ?page=<0-basiert>&size=<n>.
        # Die Parameternamen sind Springs Defaults und passen damit schon.
        default-page-size: 20
        # Obergrenze, damit ein ?size=100000 nicht die gesamte Tabelle in einer
        # Antwort ausliefert. Spring kappt still auf diesen Wert, statt den
        # Request abzulehnen; fuer einen Filterparameter ist das die
        # freundlichere Reaktion.
        max-page-size: 100

springdoc:
  # Aus in der Basiskonfiguration, an nur im Profil dev
  # (siehe application-dev.yml).
  #
  # Diese Richtung, weil sie fail-closed ist: ein Profil, das jemand spaeter
  # anlegt (prod, staging, test), erbt automatisch "aus" und muss die
  # Oberflaeche bewusst einschalten. Stuende der Schalter andersherum, wuerde
  # ein vergessenes Ueberschreiben die Doku in Produktion veroeffentlichen.
  #
  # Beide Schalter sind noetig: swagger-ui.enabled entfernt nur die Oberflaeche,
  # das rohe Dokument unter /v3/api-docs waere weiterhin abrufbar und listet
  # saemtliche Pfade und Feldnamen der API auf.
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
    # Ausgabeformat des Dokuments, bewusst 3.0 und nicht der Standard 3.1.
    #
    # In OpenAPI 3.1 ist "nullable" kein Schluesselwort mehr; swagger-core
    # verwirft jedes @Schema(nullable = true) ersatzlos und ohne Warnung.
    # Die rund 70 Stellen im Code, an denen ein Feld ausdruecklich null sein
    # darf (etwa ProjectDetailResponse.statusHistory nach §3.12), stehen dann
    # nirgends im Dokument, und die aus /v3/api-docs erzeugte
    # frontend/src/api/schema.d.ts kennt kein einziges "| null". Ein Client,
    # der auf "Feld fehlt" statt auf null prueft, liegt damit falsch, ohne
    # dass der Typecheck das sehen koennte: genau dieser Fehler hat in
    # KAN-32 die oeffentliche Projektdetailseite getroffen (KAN-74).
    #
    # Betroffen ist allein das beschreibende Dokument, das ohnehin nur im
    # Profil dev ausgeliefert wird. Endpoints, Wire-Format und Verhalten
    # bleiben unveraendert; eine Rueckstufung der API ist das nicht.
    version: openapi_3_0

app:
  security:
    jwt:
      # Kein Default-Wert: fehlt JWT_SECRET, startet die Anwendung nicht.
      # Ein eingebauter Fallback wuerde sonst still mit einem oeffentlich
      # bekannten Secret signieren.
      secret: ${JWT_SECRET}
      # 8 Stunden: eine realistische Arbeitssitzung im Editor. Kuerzere
      # Laufzeiten lassen den Autosave (PUT /projects/{id}/blocks) mitten in
      # der Bearbeitung mit 401 auflaufen. Das Restrisiko eines entwendeten
      # Tokens wird dadurch begrenzt, dass der Filter bei jedem Request
      # User.status = ACTIVE nachprueft (siehe JwtAuthenticationFilter).
      lifetime: PT8H
      issuer: eportfolio
    cors:
      # Vite-Dev-Server. Ueber CORS_ALLOWED_ORIGINS ueberschreibbar,
      # damit die Adresse nicht im Code steht.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

    login-attempts:
      # Brute-Force-Bremse am Login. Gezaehlt wird getrennt je E-Mail und je
      # Client-IP; schon einer der beiden Zaehler loest die Sperre aus.
      # Der Zaehler liegt nur im Arbeitsspeicher (siehe LoginAttemptService).
      max-failed-attempts: 5
      lockout-duration: PT15M

  registration:
    # Selbstregistrierung nach API-Contract §3.1.1 (KAN-26). Kein Geheimnis,
    # deshalb im Klartext und profilunabhaengig.
    #
    # Die Domain der hsbEmail entscheidet ueber die Rolle: steht sie in
    # student-domains, wird das Konto STUDENT, steht sie in staff-domains,
    # wird es EDITOR. Steht sie in keiner der beiden Listen, scheitert die
    # Registrierung mit 400 und es entsteht kein Konto. Verglichen wird der
    # Teil hinter dem letzten @ auf Gleichheit, nicht per Suffix: ein
    # endsWith("hs-bremen.de") liesse boesehs-bremen.de durch.
    #
    # Als Liste und nicht im Code, weil die Hochschule mehr als eine Endung
    # fuehrt und sich ihr Bestand unabhaengig von dieser Software aendert.
    # Eine weitere Endung ist damit eine Zeile hier statt einer neuen Version.
    student-domains: [ "stud.hs-bremen.de" ]
    # Darf leer bleiben. §7, offener Punkt 3 nennt das als Gegenmassnahme,
    # falls die automatische Redakteursrolle abgelehnt wird: dann vergibt sie
    # ausschliesslich der Admin ueber PATCH /admin/users/{id}.
    staff-domains: [ "hs-bremen.de" ]
    # Gueltigkeit eines Verifizierungscodes (§3.16). 24 Stunden, weil der Flow
    # zwei Postfaecher verlangt, davon das HSB-Webmail, das viele nur selten
    # oeffnen. Eine kurze Frist erzeugt hier vor allem erneuten Versand; die
    # Sicherheit des Codes traegt die Einmalverwendung zusammen mit dem
    # Rate-Limit, nicht seine Laufzeit.
    code-lifetime: PT24H

  permission:
    # Beide Schalter bilden die dokumentierten Default-Annahmen aus
    # API-Contract §7 (offene Fragen 1 und 2) ab. Sie sind noch mit den
    # Pruefern zu klaeren und deshalb bewusst konfigurierbar.
    four-eyes-principle: true
    admin-may-edit-foreign-content: false

  support:
    # Bremse am oeffentlichen Kontaktformular (API-Contract §6.5, §6.1).
    # Gezaehlt wird getrennt nach Client-IP und angegebener E-Mail-Adresse,
    # schon einer der beiden Zaehler loest die Sperre aus; wie am Login liegt
    # der Zaehler nur im Arbeitsspeicher (siehe SupportRateLimitService).
    #
    # Eigene Werte statt derer des Logins, und das ist seit v87 der erste
    # solche Fall: eine Anmeldung wiederholt man nach einem Vertipper sofort,
    # eine Support-Anfrage schreibt man einmal. Fuenf Versuche je Viertelstunde
    # waeren fuer den ersten Fall knapp und fuer den zweiten weit.
    #
    # window ist zugleich Zeitfenster und Sperrdauer: anders als am Login gibt
    # es hier kein Zuruecksetzen bei Erfolg, also braucht es keinen zweiten
    # Wert daneben.
    max-requests: 3
    window: PT1H

  edit-lock:
    # Frist der Bearbeitungssperre aus API-Contract §6.9. Bleibt der Herzschlag
    # des Editors so lange aus, faellt der Beitrag von selbst frei; ohne das
    # bliebe er nach jedem geschlossenen Tab dauerhaft gesperrt, denn eine
    # fremde Sperre laesst sich nicht brechen.
    #
    # Der Takt des Clients liegt bei zehn Sekunden und damit deutlich darunter,
    # sodass ein einzelner verlorener Herzschlag die Sperre noch nicht abgibt.
    # Die Sperre liegt nur im Arbeitsspeicher (siehe EditLockRegistry).
    ttl: PT30S

  # Austauschbare Fremddienste nach API-Contract §6.8. Hier steht nur, was
  # kein Geheimnis ist; Zugangsdaten kommen ausschliesslich aus der Umgebung
  # und ausschliesslich in application-prod.yml zusammen.
  #
  # app.storage.provider und app.mail.provider stehen bewusst NICHT hier,
  # sondern je Profil (dev: local/log, prod: azure/smtp). Ein Default an
  # dieser Stelle wuerde ein Profil, das die Auswahl vergisst, still in den
  # Entwicklungsadapter fallen lassen: ein Produktivsystem, das Mails ins Log
  # schreibt, faellt erst auf, wenn sich niemand mehr registrieren kann.
  # Ohne die Property scheitert der Kontext, und genau so ist es gewollt.
  mail:
    # Absender, Anzeigename und Basis-URL sind oeffentliche Angaben und
    # duerfen deshalb Vorgabewerte haben. Im Profil prod werden alle drei aus
    # der Umgebung ueberschrieben.
    #
    # .invalid ist nach RFC 2606 garantiert nicht aufloesbar. Damit kann eine
    # Entwicklungsumgebung, in der versehentlich der SMTP-Adapter laeuft,
    # niemandem eine Mail zustellen.
    from-address: noreply@eportfolio.invalid
    from-name: E-Portfolio Hochschule Bremen
    # Ziel der Links in Verifizierungs- und Ruecksetzmails: das Frontend,
    # nicht das Backend.
    base-url: http://localhost:5173

server:
  tomcat:
    # Gehoert zur Multipart-Schranke oben (KAN-23, angehoben mit KAN-72):
    # weist die Anwendung einen Upload ab, liest Tomcat den Rest des
    # Request-Koerpers zu Ende, damit die Antwort den Client ueberhaupt
    # erreicht. Der Default (2 MB) ist kleiner als ein abgelehnter
    # 210-MB-Upload; Tomcat wuerde die Verbindung kappen und der Client saehe
    # einen Verbindungsfehler statt des 400 FILE_TOO_LARGE. Der Wert liegt
    # deshalb oberhalb von max-request-size.
    max-swallow-size: 220MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
