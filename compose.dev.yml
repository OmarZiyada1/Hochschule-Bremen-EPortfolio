# Betriebsart DEV: Quellcode-Betrieb.
#
#   docker compose -f compose.base.yml -f compose.dev.yml up -d
#
# Quellcode liegt als Bind Mount im Container, das Backend laeuft ueber
# spring-boot:run mit DevTools, das Frontend ueber den Vite-Dev-Server.
# Gedacht zum Entwickeln, nicht zum Pruefen des Auslieferungsstands.
#
# Spring-Profil: dev. Dateien im Dateisystem, Mails in der Serverkonsole,
# Swagger-UI an, Dev-Testnutzer werden angelegt.

name: eportfolio-dev

services:
  db:
    # Hier POSTGRES_PORT und nicht DEV_POSTGRES_PORT: dieselbe Variable steht
    # in der JDBC-URL von application-dev.yml. Wer das Backend aus der IDE
    # gegen diese Datenbank startet, trifft damit denselben Port. Die beiden
    # anderen Betriebsarten haben eigene Variablen, weil sie fuer den Start
    # aus der IDE nicht gedacht sind.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    build:
      target: dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DEV_TEST_PASSWORD: ${DEV_TEST_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${DEV_BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      # Eigenes target/ im Container. Sonst schreiben Host-Maven (./mvnw test)
      # und Container-Maven in dasselbe Verzeichnis und ueberholen einander.
      - backend-target:/app/target
      # Ueberlebt das Neubauen des Containers. Der erste Start laedt die
      # Abhaengigkeiten trotzdem einmal vollstaendig herunter.
      - maven-repo:/root/.m2
      # app.storage.local-directory ist relativ zum Arbeitsverzeichnis.
      - storage:/app/var/storage
    healthcheck:
      # Der erste Start umfasst den Download des halben Maven-Universums und
      # einen vollstaendigen Uebersetzungslauf.
      start_period: 600s
      retries: 30

  # Azurite, der Blob-Emulator von Microsoft (KAN-23). Nur in DEV: der
  # Adaptertest AzureBlobFileStorageTest laeuft damit als echter Round-Trip
  # gegen einen Blob-Dienst, ohne Zugangsdaten und ohne Speicherkonto.
  # ARTIFACT-DEV bildet den Auslieferungsstand ab und PROD spricht mit echtem
  # Azure, beide brauchen ihn nicht. Die Anwendung selbst redet in DEV nicht
  # mit ihm (app.storage.provider steht auf local); er ist ein reines
  # Testwerkzeug, wie die Datenbank fuer ./mvnw test.
  # Bewusst nur der Blob-Dienst; Queue und Table braucht niemand.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data"]
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data

  frontend:
    build:
      target: dev
    # node_modules liegt im benannten Volume und ist beim ersten Start leer.
    command: ["sh", "-c", "pnpm install && pnpm dev"]
    environment:
      # Schaltet in vite.config.ts das Polling des Dateiwaechters ein.
      DOCKER_CONTAINER: "1"
      # Ziel des Entwicklungs-Proxys fuer /api (vite.config.ts).
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "${DEV_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Nie vom Host: @tailwindcss/oxide bringt eine native Bibliothek mit,
      # die dort fuer Windows uebersetzt ist.
      - node-modules:/app/node_modules

# Die Namen sind in allen drei Overlays gleich; Compose stellt den
# Projektnamen voran, hier also eportfolio-dev_maven-repo. Die Betriebsarten
# teilen sich dadurch nichts, auch nicht die Datenbank.
volumes:
  backend-target:
  maven-repo:
  node-modules:
  storage:
  azurite-data:
