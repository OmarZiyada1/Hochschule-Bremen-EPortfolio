name: eportfolio

services:
  db:
    image: postgres:16
    container_name: eportfolio-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt - .env aus .env.example anlegen}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt - .env aus .env.example anlegen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - .env aus .env.example anlegen}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # backend:          # kommt später – eigenes Dockerfile in ./backend
  #   build: ./backend
  #   depends_on: [db]

  # frontend:         # kommt später – React/Vite in ./frontend
  #   build: ./frontend

volumes:
  pgdata:
