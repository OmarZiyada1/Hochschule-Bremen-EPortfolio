services:
  db:
    image: postgres:16
    container_name: eportfolio-db
    environment:
      POSTGRES_DB: eportfolio
      POSTGRES_USER: eportfolio
      POSTGRES_PASSWORD: eportfolio
    ports:
      - "5432:5432"
    volumes:
      - eportfolio-pgdata:/var/lib/postgresql/data

volumes:
  eportfolio-pgdata:
