spring:
  # Laedt die .env aus dem Projekt-Root. Zwei Pfade, damit es sowohl beim Start
  # aus backend/ (mvnw) als auch aus dem Projekt-Root funktioniert.
  # "optional:" -> kein Fehler, wenn die Werte stattdessen als echte
  # Umgebungsvariablen gesetzt sind (CI, Prod).
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
