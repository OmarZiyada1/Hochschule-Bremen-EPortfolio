spring:
  profiles:
    # Ohne explizites SPRING_PROFILES_ACTIVE laeuft die Anwendung im dev-Profil.
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
