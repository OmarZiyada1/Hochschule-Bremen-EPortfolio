spring:
  # Laedt die .env aus dem Projekt-Root. Zwei Pfade, damit es sowohl beim Start
  # aus backend/ (mvnw) als auch aus dem Projekt-Root funktioniert.
  # "optional:" -> kein Fehler, wenn die Werte stattdessen als echte
  # Umgebungsvariablen gesetzt sind.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true
