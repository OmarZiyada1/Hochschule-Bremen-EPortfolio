<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>E-Portfolio Hochschule Bremen</title>
		<script>
			/* Setzt die Klasse "dark" an <html>, bevor React rendert, damit die
			   Seite beim Laden nicht hell aufblitzt (KAN-6, Abschnitt 4).
			   Der Speicher-Schluessel "theme" muss mit src/lib/theme.ts
			   uebereinstimmen. Startwert ohne gespeicherte Wahl ist
			   prefers-color-scheme. */
			(function () {
				try {
					var stored = window.localStorage.getItem("theme");
					var dark =
						stored !== null
							? stored === "dark"
							: window.matchMedia("(prefers-color-scheme: dark)").matches;
					if (dark) {
						document.documentElement.classList.add("dark");
					}
				} catch (error) {
					/* Speicher nicht verfuegbar: hell als Standard. */
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
