<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Portfolio Hochschule Bremen</title>
    <!--
      Keine Indexierung durch Suchmaschinen (KAN-100).

      Die oeffentlichen Ansichten zeigen Klarnamen, Studiengang und
      Biografie echter Personen. Der Prototyp laeuft unter einer privaten
      Domain; auffindbar ueber eine Suchmaschine soll er nicht sein.

      Diese Angabe steht HIER und nicht je Route, und das ist der Punkt:
      die Oberflaeche ist eine einzige HTML-Datei, jede Route erbt den
      Kopf. Eine Angabe, die React erst nachtraeglich ins Dokument haengt,
      erreicht einen Crawler ohne JavaScript gar nicht und kaeme selbst mit
      JavaScript zu spaet. So traegt jede Seite sie vom ersten Byte an,
      auch die Projektdetailseite, die das Ticket ausdruecklich nennt.

      nofollow zusaetzlich zu noindex: sonst folgt ein Crawler den Links
      der Startseite weiter auf Projekt- und Portfolioseiten und legt
      deren Adressen an, auch wenn er den Inhalt nicht aufnimmt.

      public/robots.txt ERLAUBT das Crawlen ausdruecklich, und das ist die
      Bedingung dafuer, dass diese Zeile ueberhaupt gelesen wird: wer nicht
      abrufen darf, sieht sie nie und kann die Seite trotzdem als blossen
      URL-Eintrag fuehren. Die Begruendung steht dort im Kopf.

      Dieselbe Anweisung liegt zusaetzlich als Kopfzeile X-Robots-Tag im
      Caddyfile. Sie erreicht, was ein meta-Tag nie erreicht: die ueber
      /api/files/{id} ausgelieferten Profilbilder und Dokumente.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <!--
      App-Icon und Favicon (KAN-96). Die Dateien liegen unter public/ und
      werden von Vite unveraendert ins Wurzelverzeichnis von dist/ kopiert,
      deshalb absolute Pfade und kein Bundler-Import. Motiv ist der Bremer
      Schluessel aus components/common/HsbKeyLogo.tsx auf einer Kachel in
      blau/800; erzeugt aus der Figma-Komponente "App Icon" (Seite
      Components) ueber realfavicongenerator.net.

      theme-color faerbt die Browserleiste auf Android und die Titelleiste
      der installierten Anwendung. Bewusst ein fester Wert und keine zwei
      Varianten je Modus: die Kachel ist in beiden Modi dieselbe.
    -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="E-Portfolio" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a3e7a" />
    <script>
      /*
        Setzt die Modusklasse an <html>, bevor React rendert, damit die Seite
        beim Laden nicht kurz im falschen Modus aufblitzt (KAN-6, Abschnitt 5).
        Der ThemeProvider unter src/components/theme-provider.tsx stammt aus
        der shadcn-CLI und traegt dieselbe Logik, kann sie aber erst im
        useEffect anwenden, also nach dem ersten Bild.

        Schluessel und Werte muessen mit dem Provider uebereinstimmen:
        "theme" mit "light", "dark" oder "system"; ohne gespeicherte Wahl
        gilt prefers-color-scheme.
      */
      ;(function () {
        try {
          var stored = window.localStorage.getItem("theme")
          var dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.add(dark ? "dark" : "light")
        } catch {
          /* Kein Zugriff auf Speicher oder matchMedia: hell als Standard. */
          document.documentElement.classList.add("light")
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
