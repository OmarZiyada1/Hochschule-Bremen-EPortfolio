# Auslieferung des gebauten Frontends im produktionsnahen Betrieb.
#
# Ein Origin: Oberflaeche und API liegen unter derselben Adresse. Der Browser
# sieht damit keinen fremden Ursprung, es gibt kein CORS und keinen Preflight,
# und der Anwendungscode kommt ohne Basis-URL aus. Im Entwicklungsbetrieb
# uebernimmt server.proxy aus vite.config.ts dieselbe Aufgabe.
#
# Der Name "backend" ist der Dienstname aus docker-compose.yml; Compose loest
# ihn im gemeinsamen Netz auf. depends_on sorgt dafuer, dass der Container
# existiert, bevor nginx die Adresse beim Start aufloest.

# Das Schema, das der BROWSER gesehen hat, nicht das dieser Verbindung
# (KAN-98).
#
# Ohne diese Zuordnung setzte die Weiterleitung unten schlicht $scheme, und
# das ist hier immer "http": dieser nginx hoert auf Port 80, TLS endet im
# Betrieb schon davor am Terminierer. Das Backend erfuehre also nie, dass die
# Verbindung verschluesselt war. Betroffen ist alles, was Spring aus der
# Anfrage ableitet, insbesondere absolute URLs; sie zeigten mit http auf eine
# Seite, die nur ueber https erreichbar ist.
#
# Vorhandenes X-Forwarded-Proto durchreichen, sonst auf $scheme zurueckfallen.
# Der Rueckfall ist der Normalfall von ARTIFACT-DEV, wo kein Terminierer
# davorsteht; dieselbe Datei liegt in beiden Betriebsarten im Image.
#
# Dass hier einer Kopfzeile des Aufrufers geglaubt wird, ist vertretbar, weil
# dieser nginx nicht oeffentlich erreichbar ist: compose.prod.yml bindet ihn
# auf 127.0.0.1, erreichbar ist von aussen allein caddy.
#
# Der map-Block steht im http-Kontext und damit vor "server". Das geht nur
# auf, weil diese Datei nach /etc/nginx/conf.d/ kopiert wird und von dort
# innerhalb von "http" eingebunden wird.
map $http_x_forwarded_proto $weitergereichtes_schema {
	default $scheme;
	"~.+"   $http_x_forwarded_proto;
}

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# Vite haengt an jeden Dateinamen einen Hash, die Dateien sind also
	# unveraenderlich und duerfen lange im Browser bleiben.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# Einstiegspunkt der Anwendung nie zwischenspeichern, sonst zeigt ein
	# Browser nach dem Ausrollen weiter auf die alten Hash-Dateien.
	location = /index.html {
		add_header Cache-Control "no-store";
	}

	# nginx 1.27 kennt die Endung .webmanifest nicht (nachgeprueft im Image
	# nginx:1.27-alpine): ohne diese Zeile ginge das Manifest als
	# application/octet-stream hinaus. Bewusst per default_type in einer
	# eigenen location und nicht ueber einen types-Block, denn ein solcher
	# Block im server-Kontext ersetzt die geerbte Zuordnung vollstaendig
	# und wuerde CSS, JS und die Bilder gleich mit abschalten (KAN-96).
	location = /site.webmanifest {
		default_type application/manifest+json;
	}

	# React Router: ein direkt aufgerufener Pfad ist keine Datei auf der
	# Platte. Ohne diesen Ruecksprung antwortet nginx darauf mit 404.
	location / {
		try_files $uri $uri/ /index.html;
	}

	location /api/ {
		proxy_pass http://backend:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $weitergereichtes_schema;

		# Datei-Uploads (API-Contract §6.8) laufen ueber denselben Weg.
		#
		# 205m und nicht 25m (KAN-98): der alte Wert entsprach dem
		# MEDIA-Limit aus §3.15 auf das Byte genau und lag damit unter
		# der groessten fachlichen Grenze. Seit Contract v51 sind fuer
		# VIDEO 200 MiB zulaessig, und nginx haette jeden groesseren
		# Upload abgewiesen, bevor der FileService ihn ueberhaupt sieht.
		# Der Nutzer bekaeme dabei nicht das Envelope aus §6.2, sondern
		# die HTML-Seite von nginx, die der Client mangels errorCode als
		# INTERNAL_ERROR liest.
		#
		# Die Reserve ueber 200 MiB ist dieselbe Ueberlegung, die
		# application.yml fuer max-request-size anstellt: neben der Datei
		# stehen Grenzmarken und Formularfelder im Koerper. Der Wert
		# bleibt bewusst unter spring.servlet.multipart.max-request-size
		# (212 MB), damit die Reihenfolge der Schranken erhalten bleibt:
		# nginx laesst durch, was das Backend fachlich prueft, und das
		# Backend antwortet im Envelope.
		client_max_body_size 205m;
		proxy_read_timeout 120s;
	}

	# Health und OpenAPI-Dokument. Letzteres braucht "pnpm gen:api", wenn es
	# nicht direkt gegen den veroeffentlichten Backend-Port laeuft.
	location /actuator/ {
		proxy_pass http://backend:8080;
		proxy_set_header Host $host;
	}

	location /v3/api-docs {
		proxy_pass http://backend:8080;
		proxy_set_header Host $host;
	}

	location /swagger-ui {
		proxy_pass http://backend:8080;
		proxy_set_header Host $host;
	}
}
