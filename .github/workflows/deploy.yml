# Ein Merge nach main rollt sich selbst aus (KAN-101).
#
# Drei Jobs, jeder haengt am vorigen:
#
#   test    prueft Backend und Frontend. Laeuft bei jedem Pull Request und bei
#           jedem Push auf main oder dev.
#   build   baut beide Images und schiebt sie nach GHCR. Nur bei Push auf main.
#   deploy  zieht sie auf dem VPS und startet neu. Nur nach gruenem build.
#
# DER RIEGEL LIEGT IN "needs". Seit diesem Ticket ist main gleich prod; ohne
# diese Reihenfolge ginge jeder fehlerhafte Merge sofort live. Ein roter Test
# erreicht den Server nie, und der Server bleibt dabei unveraendert stehen.
#
# WARUM HIER UND NICHT AUF DEM SERVER GEBAUT WIRD. Bis KAN-98 lief der Bau auf
# dem VPS. Er dauerte je Ausrollung fuenf bis zehn Minuten auf denselben zwei
# vCPU, die gleichzeitig die Seite ausliefern. Hier kostet er nichts, was der
# Betrieb braucht, und auf dem Server bleibt ein Ziehen von Sekunden.
#
# WAS DIESER WORKFLOW NICHT LEISTET: kein unterbrechungsfreies Ausrollen. Auch
# mit fertigen Images ist ein "up -d" ein Stop-Start. Er dauert nur noch
# Sekunden statt Minuten, und fuer ein Vorfuehrsystem ist das vertretbar.

name: CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:

# Lesend als Grundausstattung. Nur der Job build hebt sich "packages: write"
# selbst an, und nur fuer sich. Ohne diese Zeile traegt jeder Job den
# Vorgabesatz des Repositories, und der ist grosszuegiger als noetig.
permissions:
  contents: read

# Zwei Merges kurz hintereinander duerfen sich nicht ueberholen: sonst zieht
# der zweite Deploy sein Image, waehrend der erste noch neu startet, und auf
# dem Server laeuft am Ende ein anderer Stand, als die Action meldet.
#
# cancel-in-progress ausdruecklich NUR fuer Pull Requests. Einen laufenden
# Deploy abzubrechen hiesse, den Server mitten im Stop-Start stehen zu lassen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Namensraum der Registry, wie er auch in compose.base.yml steht.
  #
  # Fest kleingeschrieben und NICHT ueber ${{ github.repository_owner }}: GHCR
  # verlangt Kleinbuchstaben, der Kontoname "OmarZiyada1" traegt aber welche.
  # Der Ausdruck haette bei jedem Push einen Pfad erzeugt, den die Registry
  # ablehnt.
  IMAGE_NAMESPACE: ghcr.io/omarziyada1

jobs:
  # ======================================================================
  # 1. test
  # ======================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    # Ohne diese Zeile gilt die Voreinstellung von sechs Stunden. Ein Fall,
    # der wirklich haengt, blockiert den Runner dann einen halben Tag; der
    # ganze Lauf dauert heute rund fuenf Minuten. Die Grenze greift nur bei
    # einer echten Haengepartie und nie im Regelbetrieb.
    timeout-minutes: 30

    services:
      # Echte Postgres statt H2 oder Testcontainers (CLAUDE.md Regel 8). Die
      # Integrationstests pruefen jsonb, partielle Indizes und
      # Check-Constraints, und Flyway laeuft beim Hochfahren des Testkontexts
      # regulaer durch.
      #
      # Die Datenbank ist bei jedem Lauf LEER, anders als die
      # Entwicklungsdatenbank auf den Rechnern. Das ist ein Vorteil und kein
      # Zufall: zwei Faelle in AdminDashboardIntegrationTest scheitern lokal,
      # sobald der Demobestand alle zehn Top-10-Plaetze belegt. Hier kann das
      # nicht passieren.
      db:
        image: postgres:16
        env:
          POSTGRES_DB: eportfolio
          POSTGRES_USER: eportfolio
          # Wegwerfwert einer Datenbank, die es nach dem Lauf nicht mehr gibt.
          # Bewusst kein Secret: es waere hier nicht sicherer, wuerde aber in
          # jedem Log maskiert und damit die Fehlersuche verdunkeln.
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eportfolio -d eportfolio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # Azurite, der Blob-Emulator von Microsoft (KAN-23).
      #
      # Ohne ihn scheitert genau ein Test, AzureBlobFileStorageTest, und die
      # Ursache ist an der Meldung nicht abzulesen: er laeuft als echter
      # Round-Trip gegen einen Blob-Dienst und verbindet sich fest auf
      # 127.0.0.1 mit dem Port aus AZURITE_BLOB_PORT.
      #
      # Anders als in compose.dev.yml steht hier KEIN eigenes Kommando. Es
      # ginge auch gar nicht, Dienst-Container von GitHub Actions lassen
      # keines zu; noetig ist es aber auch nicht, denn das Standardkommando
      # des Images bindet bereits auf 0.0.0.0. In compose.dev.yml wird es nur
      # ueberschrieben, um Queue und Table wegzulassen.
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Backend
      # ----------------------------------------------------------------
      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Wegwerf-Signaturschluessel erzeugen
        run: |
          # Der Testlauf laeuft im Profil dev und liest dort normalerweise die
          # .env aus dem Projekt-Root (application-dev.yml). Die ist nicht
          # eingecheckt; die Werte kommen deshalb aus der Umgebung des
          # Prozesses, und "optional:file:" macht die fehlende Datei zu einem
          # Nicht-Ereignis.
          #
          # JWT_SECRET wird ERZEUGT und nicht hingeschrieben. Ein fester Wert
          # waere zwar kein Geheimnis (die Datenbank ist nach dem Lauf weg),
          # saehe in einer eingecheckten Datei aber wie eines aus. JwtService
          # dekodiert den Wert als Base64 und verlangt danach mindestens
          # 64 Byte, genau das liefert "openssl rand -base64 64".
          echo "JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Maven-Wrapper ausfuehrbar machen
        working-directory: backend
        run: |
          # backend/mvnw steht in Git mit Modus 100644, also ohne
          # Ausfuehrungsbit. Auf einem Linux-Runner scheitert "./mvnw" daran
          # mit "Permission denied"; auf Windows faellt es nie auf, weil dort
          # mvnw.cmd laeuft.
          #
          # Das Bit wird mit KAN-101 zusaetzlich in Git gesetzt
          # ("git update-index --chmod=+x backend/mvnw", siehe Umfang 5 des
          # Tickets). Diese Zeile bleibt trotzdem stehen und ist keine
          # Vertagung: sie kostet nichts und faengt den Fall ab, dass das Bit
          # spaeter wieder verloren geht, etwa beim Auspacken eines Archivs
          # oder ueber ein Dateisystem ohne Rechtebits.
          chmod +x ./mvnw

      - name: Auf Azurite warten
        run: |
          # Der Dienst db bringt einen Healthcheck mit, Azurite nicht: ein
          # "--health-cmd" waere fuer dieses Image umstaendlich, und die
          # Standardvorlage hat keinen. GitHub wartet deshalb nur auf die
          # Datenbank und startet den Lauf, sobald sie steht.
          #
          # In der Praxis traegt das, weil AzureBlobFileStorageTest erst
          # Minuten spaeter an die Reihe kommt. Belastbar ist es nicht, und
          # ein einzelner Test, der an einem noch nicht offenen Port
          # scheitert, haelt seit KAN-101 den Merge an. Fuenfzehn Sekunden
          # Wartebereitschaft sind billiger als dieser Fall.
          for _ in $(seq 1 15); do
            if (echo > /dev/tcp/127.0.0.1/10000) 2>/dev/null; then
              echo "Azurite nimmt Verbindungen an."
              exit 0
            fi
            sleep 1
          done
          echo "Azurite antwortet auf 127.0.0.1:10000 nicht." >&2
          exit 1

      - name: Backend-Tests
        working-directory: backend
        env:
          # POSTGRES_HOST ist localhost und nicht "db": Dienst-Container von
          # GitHub Actions veroeffentlichen ihre Ports auf dem Runner, anders
          # als im Compose-Netz, wo der Dienstname gilt.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: eportfolio
          POSTGRES_USER: eportfolio
          POSTGRES_PASSWORD: ci-postgres
          # Ohne diesen Wert legt der DevTestUserSeeder keine Testnutzer an
          # und warnt nur. Die Laenge genuegt der PasswordPolicy.
          DEV_TEST_PASSWORD: ci-dev-test-passwort
          AZURITE_BLOB_PORT: 10000
        run: ./mvnw -B test

      # ----------------------------------------------------------------
      # Frontend
      # ----------------------------------------------------------------
      - name: Node 24 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: pnpm bereitstellen
        working-directory: frontend
        run: |
          # Ueber Corepack und nicht ueber eine feste Version: Corepack liest
          # das Feld packageManager aus der package.json, genauso wie
          # frontend/Dockerfile. Eine hier hart eingetragene Version liefe
          # beim naechsten Sprung still auseinander.
          corepack enable
          corepack install

      - name: pnpm-Speicher bestimmen
        id: pnpm-store
        working-directory: frontend
        run: echo "pfad=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm-Speicher aus dem Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.pfad }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Abhaengigkeiten installieren
        working-directory: frontend
        env:
          # Dieselbe Begruendung wie im Kopf von frontend/Dockerfile: pnpm
          # weist sonst jedes Paket ab, das juenger als 24 Stunden ist, und
          # der Lauf schluege nach jeder Aktualisierung einen Tag lang fehl.
          # Der Schutz zielt auf das Aufloesen neuer Versionen, und das
          # findet hier nicht statt: das Lockfile ist eingefroren und bringt
          # seine Pruefsummen mit.
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
        run: pnpm install --frozen-lockfile

      - name: Frontend-Tests
        working-directory: frontend
        run: pnpm test

      - name: Typen pruefen
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Frontend bauen
        working-directory: frontend
        run: pnpm build

  # ======================================================================
  # 2. build
  # ======================================================================
  build:
    name: Images bauen und nach GHCR schieben
    needs: test
    # Nur der Produktivstand wird gebaut. Ein Pull Request und ein Push auf
    # dev enden nach dem Testjob.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Nur hier: allein dieser Job schreibt in die Registry. Der VPS bekommt
      # niemals ein Token mit Schreibrechten, er liest mit einem PAT, das
      # ausschliesslich read:packages traegt.
      packages: write

    outputs:
      image_tag: ${{ steps.marke.outputs.image_tag }}

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Marke bestimmen
        id: marke
        run: |
          # Zwei Marken je Image: sha-<kurzer hash> als eindeutiger Stand und
          # :main als beweglicher Zeiger.
          #
          # Ausgerollt wird ueber den SHA und nicht ueber :main. Das ist der
          # Unterschied zwischen "wir haben irgendwas Neues" und "auf dem
          # Server laeuft Commit abc1234": ohne den SHA gibt es keinen
          # definierten Punkt, auf den ein Rollback zurueckgeht.
          echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Das eingebaute Token des Laufs, kein hinterlegtes Geheimnis. Es
          # gilt nur fuer diesen Lauf und traegt genau die Rechte, die oben
          # unter permissions stehen.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend-Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          # Ausdruecklich die Stufe runtime: das schlanke JRE-Image mit dem
          # fertigen Jar. Ohne target baute Docker die letzte Stufe des
          # Dockerfiles, was hier zwar dieselbe waere, aber nur zufaellig.
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/eportfolio-backend:${{ steps.marke.outputs.image_tag }}
            ${{ env.IMAGE_NAMESPACE }}/eportfolio-backend:main
          # Eigener scope je Dienst. Mit einem gemeinsamen Zwischenspeicher
          # verdraengen sich Backend und Frontend gegenseitig, und jeder Lauf
          # dauert so lange wie der erste.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend-Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/eportfolio-frontend:${{ steps.marke.outputs.image_tag }}
            ${{ env.IMAGE_NAMESPACE }}/eportfolio-frontend:main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          # DIE VIER ANGABEN DES IMPRESSUMS (KAN-100) MUESSEN HIER STEHEN.
          #
          # Vite backt sie beim Buendeln in die JS-Dateien ein; die Stufe
          # runtime ist ein nginx, der fertige Dateien ausliefert. Dieser Bau
          # ist also der einzige Zeitpunkt, an dem der Wert ankommen kann.
          # Solange auf dem VPS gebaut wurde, kamen sie aus der dortigen .env.
          # Sobald das Image hier entsteht, sieht es diese Datei nie, und ohne
          # die vier Zeilen stuende das Impressum auf PROD leer da: kein
          # Abbruch, nur eine Seite, die sichtbar sagt, dass die Angaben
          # fehlen. Genau der Zustand, den KAN-100 beseitigt hat.
          #
          # Als Secrets und nicht als Variablen, obwohl die Anschrift auf der
          # fertigen Seite oeffentlich steht: so bleibt sie in den Logs
          # maskiert und kann nicht versehentlich in eine Ausgabe geraten.
          # Die Server-.env behaelt die vier Werte trotzdem, sie werden fuer
          # den Notweg aus docs/SETUP.md Abschnitt 10 gebraucht.
          build-args: |
            VITE_IMPRINT_OPERATOR=${{ secrets.VITE_IMPRINT_OPERATOR }}
            VITE_IMPRINT_STREET=${{ secrets.VITE_IMPRINT_STREET }}
            VITE_IMPRINT_CITY=${{ secrets.VITE_IMPRINT_CITY }}
            VITE_IMPRINT_EMAIL=${{ secrets.VITE_IMPRINT_EMAIL }}

  # ======================================================================
  # 3. deploy
  # ======================================================================
  deploy:
    name: Auf dem VPS ausrollen
    # Bewusst ohne eigenes "if". Die Bedingung erbt dieser Job ueber "needs":
    # wird build uebersprungen, gilt fuer deploy dieselbe Bedingung als nicht
    # erfuellt, und er laeuft nicht mit. Eine zweite, gleichlautende Zeile
    # koennte mit der Zeit von der ersten abweichen.
    needs: build
    runs-on: ubuntu-latest
    # Knapper als bei den anderen beiden: der eigentliche Ausfall auf dem
    # Server dauert Sekunden, und die Gesundheitsschleife gibt nach fuenf
    # Minuten von selbst auf. Bleibt der Job darueber hinaus stehen, haengt
    # die SSH-Verbindung, und dann ist Abbrechen besser als Warten.
    timeout-minutes: 20

    # KEIN actions/checkout. Dieser Job braucht den Quellcode nicht: er setzt
    # eine Marke, zieht zwei Images und startet neu. Alles, was er dazu wissen
    # muss, steht in den Secrets und in needs.build.outputs.

    steps:
      - name: SSH-Zugang einrichten
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Der oeffentliche Wirtsschluessel des Servers, hinterlegt als
          # viertes Secret. Ohne ihn bliebe nur StrictHostKeyChecking=no, und
          # damit wuerde die Action jeden Rechner akzeptieren, der sich
          # zwischen GitHub und den VPS setzt. Wie er zu beschaffen ist, steht
          # in docs/SETUP.md Abschnitt 10.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ausrollen
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          # Der Hostname steht ausdruecklich als Secret und nicht im Workflow:
          # ein oeffentlich gewordener Workflow soll nicht die Serveradresse
          # mitliefern.
          #
          # BatchMode verhindert die Passwortabfrage, nicht das Haengen. Ohne
          # die drei Zeitwerte kann eine tote Verbindung bis zum Job-Limit
          # stehen bleiben, und weil cancel-in-progress fuer Pushes bewusst
          # aus ist, wartet jeder folgende Merge in derselben
          # Concurrency-Gruppe mit.
          #
          # Der Fernteil kommt als Heredoc ueber die Standardeingabe. Das
          # einfache Anfuehrungszeichen an FERN ist wichtig: es haelt die
          # lokale Shell davon ab, den Text zu ersetzen. Die eine Angabe, die
          # drueben gebraucht wird, geht ueber die Befehlszeile mit.
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              "${VPS_USER}@${VPS_HOST}" \
              "IMAGE_TAG='${IMAGE_TAG}' bash -s" <<'FERN'
          set -euo pipefail

          # ==============================================================
          # WARUM DER GANZE RUMPF IN EINER FUNKTION STEHT
          # ==============================================================
          # Dieses Skript kommt ueber die STANDARDEINGABE (bash -s mit
          # Heredoc). Und "docker compose exec -T" haengt die Standardeingabe
          # an den Container weiter, genau deshalb funktioniert sonst
          # "exec -T db psql < dump.sql".
          #
          # Hier ist die Standardeingabe aber dieses Skript selbst. Ein
          # "exec -T" mitten im Ablauf liest deshalb den REST DES SKRIPTS weg:
          # die Sicherung wird geschrieben, alles danach verschwindet
          # stillschweigend, und die Shell endet mit Rueckgabewert 0. Auf dem
          # Server waere nichts ausgerollt, und die Action meldete gruen.
          # Nachgestellt und bestaetigt, bevor diese Fassung entstand.
          #
          # Als Funktion liest bash zuerst den vollstaendigen Rumpf ein und
          # fuehrt ihn danach aus. Der Aufruf am Ende klemmt die
          # Standardeingabe mit </dev/null ab, und zwar fuer JEDEN Befehl
          # darin, nicht nur fuer den einen, an dem es aufgefallen ist. Ein
          # "</dev/null" an einer einzelnen Zeile genuegte nicht: der naechste
          # Befehl, der die Standardeingabe liest, braechte den Fehler zurueck.
          ausrollen() {
            cd /opt/eportfolio

            compose() {
              docker compose -f compose.base.yml -f compose.prod.yml "$@"
            }

            # ------------------------------------------------------------
            # 1. Sichern, immer
            # ------------------------------------------------------------
            # Ohne Fallunterscheidung, und das ist eine bewusste Verschaerfung
            # gegenueber "nur wenn eine Migration dabei ist".
            #
            # Eine Erkennung ueber den Commit-Vergleich beantwortet die
            # falsche Frage: sie vergleicht Push gegen Push, waehrend es auf
            # den Abstand zwischen SERVERSTAND und neuem Stand ankaeme.
            # Scheitert ein Lauf in build oder deploy, bleibt der Server
            # zurueck; der naechste Push vergleicht ab dem gescheiterten
            # Commit, saehe keine Migration mehr und rollte sie ungesichert
            # aus. Genau der Fall, gegen den die Sicherung da ist.
            #
            # Der Preis ist ein pg_dump je Ausrollung, also Sekunden bei
            # diesem Datenbestand. Flyway-Migrationen laufen beim Start des
            # Backends und haben keinen Rueckweg: ein Rollback auf ein
            # aelteres Image bringt das Schema NICHT zurueck.
            if [ ! -w /var/backups/eportfolio ]; then
              echo "Kein beschreibbares /var/backups/eportfolio." >&2
              echo "Anlegen mit: sudo install -d -o deploy -g deploy /var/backups/eportfolio" >&2
              exit 1
            fi
            ziel="/var/backups/eportfolio/vor-${IMAGE_TAG}-$(date +%F-%H%M).sql.gz"

            # Benutzername und Datenbank kommen aus der Umgebung DES
            # CONTAINERS und nicht aus der .env auf dem Wirt: dort stehen sie
            # ohnehin, und so muss dieser Ablauf die Datei mit den
            # Geheimnissen nicht anfassen.
            compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
              | gzip > "$ziel"
            echo "Sicherung geschrieben: $ziel ($(du -h "$ziel" | cut -f1))"
            # Dieselbe Frist wie beim taeglichen Timer aus KAN-98.
            find /var/backups/eportfolio -name 'vor-*.sql.gz' -mtime +14 -delete

            # ------------------------------------------------------------
            # 2. Ziehen, VOR dem Schreiben der .env
            # ------------------------------------------------------------
            # Die Reihenfolge ist Absicht. Stuende die neue Marke schon in der
            # .env und das Ziehen scheiterte, zeigte die Datei auf ein Image,
            # das es auf dem Server nicht gibt; der naechste Handgriff eines
            # Menschen ("up -d") liefe dann ins Leere. So bleibt die .env bis
            # zuletzt auf dem laufenden Stand.
            #
            # IMAGE_TAG kommt hier aus der Umgebung und nicht aus der Datei:
            # Compose bevorzugt die Umgebung gegenueber der .env.
            #
            # Nur backend und frontend, nicht der ganze Stapel: ein pauschales
            # "pull" holte auch postgres:16 und caddy:2-alpine neu und wuerde
            # bei jeder Ausrollung ungefragt die Datenbank neu starten. Das
            # gehoert entschieden und nicht nebenbei getan.
            IMAGE_TAG="$IMAGE_TAG" compose pull backend frontend

            # ------------------------------------------------------------
            # 3. IMAGE_TAG in die .env schreiben
            # ------------------------------------------------------------
            # DIESE DATEI IST DIE EMPFINDLICHSTE STELLE DES GANZEN ABLAUFS.
            # Sie liegt nicht im Repository und ist die einzige Quelle aller
            # Betriebswerte: Azure-Kontoschluessel, Mailpasswort, JWT_SECRET,
            # das Datenbankpasswort, die fuenf BOOTSTRAP_ADMIN_-Werte,
            # APP_DOMAIN, ACME_EMAIL, COMPOSE_PROFILES. Fuer das
            # Datenbankpasswort gibt es keine zweite Quelle, es haengt im
            # Volume fest. Deshalb drei Riegel statt eines Einzeilers.
            if [ ! -f .env ]; then
              echo "Keine .env in /opt/eportfolio. Ohne sie fehlt jeder Betriebswert." >&2
              exit 1
            fi

            vorher="$(wc -l < .env)"
            tmp="$(mktemp -p /opt/eportfolio .env.XXXXXX)"

            # NICHT "|| true". grep endet mit 1, wenn keine Zeile passt (der
            # Regelfall bei der ersten Ausrollung), und ab 2 bei einem echten
            # Fehler: Datei unlesbar, Platte voll. Ein pauschales "true"
            # schluckte beides, und die .env bestuende danach nur noch aus der
            # einen Zeile, die gleich angehaengt wird.
            grep -v '^IMAGE_TAG=' .env > "$tmp"; rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "Konnte .env nicht lesen (grep $rc), nichts geaendert." >&2
              rm -f "$tmp"
              exit 1
            fi

            # Inhaltsprobe neben der Laengenprobe: die eine erkennt eine
            # abgeschnittene Datei, die andere eine, die zwar Zeilen hat, aber
            # nicht mehr die richtigen.
            if ! grep -q '^POSTGRES_PASSWORD=' "$tmp"; then
              echo ".env unvollstaendig, nicht ersetzt." >&2
              rm -f "$tmp"
              exit 1
            fi

            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> "$tmp"

            # Die neue Fassung kann nie kuerzer sein als die alte: entweder
            # ersetzt sie eine vorhandene IMAGE_TAG-Zeile, oder sie kommt
            # dazu.
            nachher="$(wc -l < "$tmp")"
            if [ "$nachher" -lt "$vorher" ]; then
              echo "Die neue .env waere kuerzer als die alte ($nachher statt $vorher Zeilen)." >&2
              rm -f "$tmp"
              exit 1
            fi

            # Ueber eine temporaere Datei und "cat >" statt "sed -i": so
            # bleibt die .env dieselbe Datei und behaelt Eigentuemer und
            # Rechte. "sed -i" legt eine neue an und setzt die Rechte nach der
            # umask.
            cat "$tmp" > .env
            rm -f "$tmp"
            echo "IMAGE_TAG=$IMAGE_TAG"

            # ------------------------------------------------------------
            # 4. Starten
            # ------------------------------------------------------------
            # --no-build ist der eigentliche Schalter dieses Tickets: ohne ihn
            # versuchte Compose bei einem fehlenden Image zu bauen, und genau
            # das soll auf dem Server nicht mehr passieren.
            #
            # Beide Dienste werden dabei immer neu erstellt, weil beide eine
            # neue Marke tragen. Das ist wichtig: wuerde allein das Backend
            # ersetzt, bekaeme es eine neue Adresse im Compose-Netz, und der
            # nginx des Frontends hielte die alte fest. Die API antwortete
            # danach dauerhaft mit 502, obwohl beide Container laufen.
            compose up -d --no-build

            # ------------------------------------------------------------
            # 5. Warten, bis das Backend gesund ist
            # ------------------------------------------------------------
            # ps -aq und nicht ps -q: startet der Container gar nicht erst
            # durch, etwa wegen eines fehlenden Werts in der .env, waere die
            # Liste der LAUFENDEN Container leer, und die Ausrollung braeche
            # ohne eine einzige Logzeile ab. Genau dieser Fall ist der
            # haeufigste.
            cid="$(compose ps -aq backend)"
            if [ -z "$cid" ]; then
              echo "Nach dem Start gibt es keinen Backend-Container." >&2
              compose ps -a >&2 || true
              exit 1
            fi

            # Gefragt wird der Healthcheck des Containers und nicht mit curl
            # ein Port: der Check aus compose.base.yml ruft /actuator/health
            # im Container selbst auf, und nur er kennt das groessere
            # Zeitfenster aus compose.prod.yml, das im Profil prod am
            # Mailserver haengt.
            #
            # Der Rueckfall auf "fehlt" haelt set -e aus der Schleife heraus:
            # ohne ihn braeche ein Container ohne Healthcheck oder ein
            # zwischenzeitlich verschwundener das Skript mit einer Meldung des
            # Go-Templates ab, die niemand deutet.
            zustand="unbekannt"
            for _ in $(seq 1 60); do
              zustand="$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo fehlt)"
              if [ "$zustand" = "healthy" ]; then
                break
              fi
              sleep 5
            done

            if [ "$zustand" != "healthy" ]; then
              echo "Backend wurde nicht gesund (Zustand: $zustand)." >&2
              compose logs --tail=80 backend >&2 || true
              echo "" >&2
              # ES WIRD NICHT AUTOMATISCH ZURUECKGEROLLT, und das gehoert
              # hierhin und nicht allein in eine Doku, die im Ernstfall
              # niemand aufschlaegt. Ein automatischer Rueckweg waere hier
              # auch die falsche Zusage: eine Flyway-Migration dieses Standes
              # kann bereits gelaufen sein, und ein aelteres Image traefe dann
              # auf ein neueres Schema. Das kann schlimmer sein als der
              # Stillstand.
              echo "Die Seite ist ab hier unten. Es wird NICHT automatisch zurueckgerollt," >&2
              echo "weil eine Migration dieses Standes bereits gelaufen sein kann." >&2
              echo "Zurueck auf den vorigen Stand (docs/SETUP.md, Abschnitt 10):" >&2
              echo "  cd /opt/eportfolio" >&2
              echo "  sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=sha-<alt>/' .env" >&2
              echo "  docker compose -f compose.base.yml -f compose.prod.yml pull backend frontend" >&2
              echo "  docker compose -f compose.base.yml -f compose.prod.yml up -d --no-build" >&2
              echo "Die Sicherung von eben liegt unter $ziel" >&2
              exit 1
            fi

            # Caddy mitpruefen, sobald die .env das Profil edge fuehrt.
            #
            # Der Healthcheck oben fragt das Backend IM COMPOSE-NETZ. Faellt
            # caddy aus, meldet das Backend weiter munter "healthy", waehrend
            # die Seite von aussen weg ist: ein gruener Lauf ueber einer toten
            # Seite, und niemand erfaehrt es. Caddy ist das einzige nach
            # aussen geoeffnete Tor und hat keinen eigenen Healthcheck,
            # deshalb genuegt hier die Frage, ob er ueberhaupt laeuft.
            if grep -q '^COMPOSE_PROFILES=.*edge' .env; then
              caddy_id="$(compose ps -aq caddy)"
              if [ -z "$caddy_id" ] \
                 || [ "$(docker inspect --format '{{.State.Running}}' "$caddy_id" 2>/dev/null || echo false)" != "true" ]; then
                echo "Profil edge ist gesetzt, aber caddy laeuft nicht." >&2
                compose logs --tail=40 caddy >&2 || true
                exit 1
              fi
            fi

            # ------------------------------------------------------------
            # 6. Melden, was jetzt laeuft
            # ------------------------------------------------------------
            # Die Zeilen der DoD: docker inspect nennt fuer beide Container
            # ein Image mit sha-<hash>, und der Hash entspricht dem
            # Merge-Commit.
            for dienst in backend frontend; do
              id="$(compose ps -aq "$dienst")"
              printf '%-9s %s\n' "$dienst" \
                "$(docker inspect --format '{{.Config.Image}}' "$id")"
            done

            # ------------------------------------------------------------
            # 7. Aufraeumen
            # ------------------------------------------------------------
            # Schichten ohne Marke, und darueber hinaus die alten Staende.
            #
            # "image prune" allein genuegt NICHT: jede Ausrollung legt ein
            # Backend- und ein Frontend-Image unter sha-<hash> ab, zusammen
            # rund 800 MB, und markierte Images raeumt prune nie ab. Nach etwa
            # zwanzig Merges waeren das ueber 16 GB auf einem Server, auf dem
            # eine volle Platte zuerst Postgres trifft. Gegen genau das steht
            # in compose.prod.yml schon die Log-Rotation.
            #
            # Die letzten fuenf Staende bleiben liegen, denn genau sie braucht
            # ein Rollback. Ein noch aelterer Stand laesst sich jederzeit neu
            # aus GHCR ziehen, dort wird nichts geloescht.
            docker image prune -f > /dev/null
            for name in eportfolio-backend eportfolio-frontend; do
              docker images \
                --filter "reference=ghcr.io/omarziyada1/${name}:sha-*" \
                --format '{{.CreatedAt}}\t{{.ID}}' \
                | sort -r | tail -n +6 | cut -f2 \
                | xargs -r docker rmi > /dev/null 2>&1 || true
            done
          }

          # HIER klemmt </dev/null die Standardeingabe ab, siehe den Block
          # ueber der Funktion. Ohne diese Umleitung liest der erste
          # "compose exec -T" den Rest dieses Skripts weg.
          ausrollen </dev/null
          FERN

      - name: Schluessel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
