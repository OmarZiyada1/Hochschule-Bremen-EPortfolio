# Ein Merge nach main rollt sich selbst aus (KAN-101, Zuschnitt aus KAN-102).
#
# Der Graph, und zwar genau so, wie die needs-Zeilen ihn aufspannen:
#
#   backend-tests  ─┐
#                   ├─ tests ─┬─ build-backend  ─┐
#   frontend-tests ─┘         └─ build-frontend ─┴─ deploy
#
#   marke laeuft daneben, ohne Vorgaenger, und liefert seine Marke an
#   build-backend, build-frontend und deploy. Er steht bewusst NICHT vor den
#   Testjobs: die brauchen ihn nicht, und er soll sie nicht aufhalten.
#
#   marke           bestimmt die Marke der Images.
#   backend-tests   ./mvnw test gegen echte Postgres und Azurite.
#   frontend-tests  pnpm test, typecheck, lint, build. Ohne Dienst-Container.
#   tests           das Gate. Traegt den Namen, auf den der Branch-Schutz
#                   zeigt, und fasst die beiden Testjobs zu einem Ergebnis.
#   build-backend   je ein Image, parallel, nur bei push auf main.
#   build-frontend
#   deploy          zieht auf dem VPS den Checkout nach, holt beide
#                   Images, startet neu und weist nach, dass genau dieser
#                   Stand laeuft (deploy/ausrollen.sh, KAN-106).
#
# DER RIEGEL LIEGT IN "needs". Seit KAN-101 ist main gleich prod; ohne diese
# Reihenfolge ginge jeder fehlerhafte Merge sofort live. Ein roter Test
# erreicht den Server nie, und der Server bleibt dabei unveraendert stehen.
#
# ZWEI AUSLOESER (KAN-106). Ein Push nach main durchlaeuft den ganzen Graphen.
# Ein von Hand gestarteter Lauf (workflow_dispatch, Eingabe image_tag)
# ueberspringt Tests und Bau und rollt eine frueher ueber main gebaute Marke
# aus: das ist der Rollback, mit denselben Pruefungen wie jede Ausrollung.
# Er laeuft nur auf main; auf jedem anderen Zweig bricht schon der Job marke
# rot ab, damit ein Fehlgriff im Zweig-Menue nicht als gruener Lauf ohne
# Wirkung endet.
#
# WARUM DER FERNTEIL EINE DATEI IST (KAN-106). Bis dahin stand er als
# Heredoc im Job deploy. Als deploy/ausrollen.sh laesst er sich lesen,
# mit "bash -n" pruefen und im Notfall von Hand aufrufen; der Job holt ihn
# aus dem Checkout zu github.sha (Merge-Commit, beim Rollback der Stand von
# main) und schickt ihn per SSH an den Server.
#
# WARUM GETRENNTE JOBS UND NICHT EIN GROSSER (KAN-102). Zwei Gruende, und der
# erste ist der wichtigere: in der Pruefliste eines Pull Requests steht dann
# "Backend-Tests" oder "Frontend-Tests" rot, und niemand muss ein Protokoll
# oeffnen, um zu erfahren, welche Schicht betroffen ist. Der zweite ist Zeit:
# im Lauf 34700332110 trug der Frontend-Testlauf 442 der 681 Sekunden, das
# Backend 128. Nebeneinander ist der kritische Pfad der laengere der beiden
# statt ihrer Summe.
#
# WOHER DIE ZEITANGABEN IN DIESER DATEI STAMMEN. Alle Zahlen unten sind aus
# den SCHRITTZEITEN des Laufs 34700332110 abgeleitet, und der lief noch mit
# dem alten Sammeljob; in dieser Form hat der Workflow zu dem Zeitpunkt nicht
# existiert. Es sind also begruendete Erwartungen und keine Messungen dieser
# Fassung. Wer eine Zahl aendert, misst vorher an einem echten Lauf nach:
# geschaetzt war schon einmal eine falsch (fuenf Minuten statt vierzehn).
#
# WARUM HIER UND NICHT AUF DEM SERVER GEBAUT WIRD. Bis KAN-98 lief der Bau auf
# dem VPS. Er dauerte je Ausrollung fuenf bis zehn Minuten auf denselben zwei
# vCPU, die gleichzeitig die Seite ausliefern. Hier kostet er nichts, was der
# Betrieb braucht, und auf dem Server bleibt ein Ziehen von Sekunden.
#
# WAS DIESER WORKFLOW NICHT LEISTET: kein unterbrechungsfreies Ausrollen. Auch
# mit fertigen Images ist ein "up -d" ein Stop-Start. Er dauert nur noch
# Sekunden statt Minuten, und fuer ein Vorfuehrsystem ist das vertretbar.

name: CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  # Von Hand, fuer Rollback und erneutes Ausrollen (KAN-106). Die Marke wird
  # im Job marke auf ihre Form geprueft; alles Weitere prueft das Skript auf
  # dem Server (liegt sie in GHCR, gehoert sie zu einem Commit auf main).
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Marke, die ausgerollt werden soll: sha-<kurzer commit-hash> eines
          Standes, der frueher ueber main gebaut wurde. Tests und Bau laufen
          dabei nicht.
        required: true
        type: string

# Lesend als Grundausstattung. Nur die beiden Build-Jobs heben sich
# "packages: write" selbst an, und nur fuer sich. Ohne diese Zeile traegt jeder
# Job den Vorgabesatz des Repositories, und der ist grosszuegiger als noetig.
permissions:
  contents: read

# Zwei Merges kurz hintereinander duerfen sich nicht ueberholen: sonst zieht
# der zweite Deploy sein Image, waehrend der erste noch neu startet, und auf
# dem Server laeuft am Ende ein anderer Stand, als die Action meldet.
#
# Die Gruppe haengt am Workflow und nicht am Job, gilt also fuer den ganzen
# Graphen. cancel-in-progress ausdruecklich NUR fuer Pull Requests. Einen
# laufenden Deploy abzubrechen hiesse, den Server mitten im Stop-Start stehen
# zu lassen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Namensraum der Registry, wie er auch in compose.base.yml steht.
  #
  # Fest kleingeschrieben und NICHT ueber ${{ github.repository_owner }}: GHCR
  # verlangt Kleinbuchstaben, der Kontoname "OmarZiyada1" traegt aber welche.
  # Der Ausdruck haette bei jedem Push einen Pfad erzeugt, den die Registry
  # ablehnt.
  IMAGE_NAMESPACE: ghcr.io/omarziyada1

jobs:
  # ======================================================================
  # marke
  # ======================================================================
  marke:
    name: Marke bestimmen
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # KEIN needs. Der Job laeuft sofort, parallel zu den Tests, und ist damit
    # nie auf dem kritischen Pfad: wenn die Tests durch sind, liegt die Marke
    # laengst vor.
    #
    # Auch KEIN "if". Damit laeuft er bei jedem Pull Request mit, obwohl dort
    # niemand die Marke braucht; das kostet rund fuenfzehn Sekunden Runner und
    # sonst nichts. Die Bedingung ein drittes Mal hinzuschreiben waere der
    # schlechtere Tausch: sie steht schon an build-backend und build-frontend,
    # und drei Kopien laufen mit der Zeit auseinander. Ausgerollt wird davon
    # nichts: deploy prueft die Ergebnisse der beiden Build-Jobs selbst und
    # laeuft ohne sie nur beim von Hand gestarteten Rollback auf main.
    #
    # WARUM UEBERHAUPT EIN EIGENER JOB fuer eine einzige Zeile. build-backend,
    # build-frontend und deploy brauchen denselben Wert. Drei Stellen, die ihn
    # je fuer sich berechnen, sind genau das Duplikat, das mit der Zeit
    # auseinanderlaeuft, und die Folge waere ein Server, der ein anderes Image
    # faehrt, als die Action meldet.
    outputs:
      image_tag: ${{ steps.setzen.outputs.image_tag }}

    steps:
      - name: Marke setzen
        id: setzen
        env:
          # Nur beim von Hand gestarteten Lauf gesetzt, sonst leer.
          GEWUENSCHT: ${{ inputs.image_tag }}
        run: |
          # Zwei Marken je Image: sha-<kurzer hash> als eindeutiger Stand und
          # :main als beweglicher Zeiger.
          #
          # Ausgerollt wird ueber den SHA und nicht ueber :main. Das ist der
          # Unterschied zwischen "wir haben irgendwas Neues" und "auf dem
          # Server laeuft Commit abc1234": ohne den SHA gibt es keinen
          # definierten Punkt, auf den ein Rollback zurueckgeht.
          #
          # Beim von Hand gestarteten Lauf (KAN-106) kommt die Marke aus der
          # Eingabe. Sie wird HIER auf ihre Form geprueft und nirgends sonst:
          # deploy reicht sie in einer Befehlszeile an den Server weiter, und
          # dort soll nur ankommen, was wie eine Marke aussieht.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Nur auf main. Auf jedem anderen Zweig wuerde deploy uebersprungen
            # und der Lauf stuende GRUEN da, ohne etwas getan zu haben: ein
            # Fehlgriff im Zweig-Menue saehe aus wie ein gelungener Rollback.
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "Rollback nur von main aus, gestartet auf $GITHUB_REF." >&2
              exit 1
            fi
            if ! [[ "$GEWUENSCHT" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
              echo "image_tag '$GEWUENSCHT' hat nicht die Form sha-<kurzer commit-hash>." >&2
              exit 1
            fi
            marke="$GEWUENSCHT"
          else
            marke="sha-${GITHUB_SHA::7}"
          fi
          echo "image_tag=$marke" >> "$GITHUB_OUTPUT"
          echo "Marke: $marke"

  # ======================================================================
  # backend-tests
  # ======================================================================
  backend-tests:
    name: Backend-Tests
    # Nicht beim von Hand gestarteten Rollback (KAN-106): dort wird eine
    # Marke ausgerollt, die beim Bau schon durch diese Tests gegangen ist.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Erwartet rund 3:15 einschliesslich Container und Aufsetzen, abgeleitet
    # aus den Schrittzeiten von Lauf 34700332110 (siehe Kopf der Datei). Die
    # Grenze greift nur bei einer echten Haengepartie.
    timeout-minutes: 25

    services:
      # Echte Postgres statt H2 oder Testcontainers (CLAUDE.md Regel 8). Die
      # Integrationstests pruefen jsonb, partielle Indizes und
      # Check-Constraints, und Flyway laeuft beim Hochfahren des Testkontexts
      # regulaer durch.
      #
      # Die Datenbank ist bei jedem Lauf LEER, anders als die
      # Entwicklungsdatenbank auf den Rechnern. Das ist ein Vorteil und kein
      # Zufall: zwei Faelle in AdminDashboardIntegrationTest scheitern lokal,
      # sobald der Demobestand alle zehn Top-10-Plaetze belegt. Hier kann das
      # nicht passieren.
      db:
        image: postgres:16
        env:
          POSTGRES_DB: eportfolio
          POSTGRES_USER: eportfolio
          # Wegwerfwert einer Datenbank, die es nach dem Lauf nicht mehr gibt.
          # Bewusst kein Secret: es waere hier nicht sicherer, wuerde aber in
          # jedem Log maskiert und damit die Fehlersuche verdunkeln.
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eportfolio -d eportfolio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # Azurite, der Blob-Emulator von Microsoft (KAN-23).
      #
      # Ohne ihn scheitert genau ein Test, AzureBlobFileStorageTest, und die
      # Ursache ist an der Meldung nicht abzulesen: er laeuft als echter
      # Round-Trip gegen einen Blob-Dienst und verbindet sich fest auf
      # 127.0.0.1 mit dem Port aus AZURITE_BLOB_PORT.
      #
      # Anders als in compose.dev.yml steht hier KEIN eigenes Kommando. Es
      # ginge auch gar nicht, Dienst-Container von GitHub Actions lassen
      # keines zu; noetig ist es aber auch nicht, denn das Standardkommando
      # des Images bindet bereits auf 0.0.0.0. In compose.dev.yml wird es nur
      # ueberschrieben, um Queue und Table wegzulassen.
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: Java 21 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Wegwerf-Signaturschluessel erzeugen
        run: |
          # Der Testlauf laeuft im Profil dev und liest dort normalerweise die
          # .env aus dem Projekt-Root (application-dev.yml). Die ist nicht
          # eingecheckt; die Werte kommen deshalb aus der Umgebung des
          # Prozesses, und "optional:file:" macht die fehlende Datei zu einem
          # Nicht-Ereignis.
          #
          # JWT_SECRET wird ERZEUGT und nicht hingeschrieben. Ein fester Wert
          # waere zwar kein Geheimnis (die Datenbank ist nach dem Lauf weg),
          # saehe in einer eingecheckten Datei aber wie eines aus. JwtService
          # dekodiert den Wert als Base64 und verlangt danach mindestens
          # 64 Byte, genau das liefert "openssl rand -base64 64".
          echo "JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Maven-Wrapper ausfuehrbar machen
        working-directory: backend
        run: |
          # Das Ausfuehrungsbit steht seit KAN-101 in Git. Diese Zeile bleibt
          # trotzdem stehen und ist keine Vertagung: sie kostet nichts und
          # faengt den Fall ab, dass es wieder verloren geht, etwa beim
          # Auspacken eines Archivs oder ueber ein Dateisystem ohne Rechtebits.
          chmod +x ./mvnw

      - name: Auf Azurite warten
        run: |
          # Der Dienst db bringt einen Healthcheck mit, Azurite nicht: ein
          # "--health-cmd" waere fuer dieses Image umstaendlich, und die
          # Standardvorlage hat keinen. GitHub wartet deshalb nur auf die
          # Datenbank und startet den Lauf, sobald sie steht.
          #
          # In der Praxis traegt das, weil AzureBlobFileStorageTest erst
          # Minuten spaeter an die Reihe kommt. Belastbar ist es nicht, und
          # ein einzelner Test, der an einem noch nicht offenen Port
          # scheitert, haelt seit KAN-101 den Merge an. Fuenfzehn Sekunden
          # Wartebereitschaft sind billiger als dieser Fall.
          for _ in $(seq 1 15); do
            if (echo > /dev/tcp/127.0.0.1/10000) 2>/dev/null; then
              echo "Azurite nimmt Verbindungen an."
              exit 0
            fi
            sleep 1
          done
          echo "Azurite antwortet auf 127.0.0.1:10000 nicht." >&2
          exit 1

      - name: Tests
        working-directory: backend
        env:
          # POSTGRES_HOST ist localhost und nicht "db": Dienst-Container von
          # GitHub Actions veroeffentlichen ihre Ports auf dem Runner, anders
          # als im Compose-Netz, wo der Dienstname gilt.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: eportfolio
          POSTGRES_USER: eportfolio
          POSTGRES_PASSWORD: ci-postgres
          # Ohne diesen Wert legt der DevTestUserSeeder keine Testnutzer an
          # und warnt nur. Die Laenge genuegt der PasswordPolicy.
          DEV_TEST_PASSWORD: ci-dev-test-passwort
          AZURITE_BLOB_PORT: 10000
        run: ./mvnw -B test

  # ======================================================================
  # frontend-tests
  # ======================================================================
  frontend-tests:
    name: Frontend-Tests
    # Wie bei backend-tests: nicht beim Rollback.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Erwartet rund 8:40, abgeleitet wie oben. Der laengste Ast des Graphen
    # und damit der kritische Pfad; wer die Gesamtzeit druecken will, setzt
    # hier an und nicht am Backend.
    timeout-minutes: 30

    # KEINE services. Das Frontend braucht weder Datenbank noch
    # Blob-Emulator: MSW beantwortet die Requests im Testlauf, und
    # typecheck, lint und build sprechen ohnehin mit niemandem. Allein das
    # spart die 37 Sekunden, die das Hochfahren der beiden Container im
    # gemeinsamen Job gekostet hat.

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: Node 24 einrichten
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: pnpm bereitstellen
        working-directory: frontend
        run: |
          # Ueber Corepack und nicht ueber eine feste Version: Corepack liest
          # das Feld packageManager aus der package.json, genauso wie
          # frontend/Dockerfile. Eine hier hart eingetragene Version liefe
          # beim naechsten Sprung still auseinander.
          corepack enable
          corepack install

      - name: pnpm-Speicher bestimmen
        id: pnpm-store
        working-directory: frontend
        run: echo "pfad=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm-Speicher aus dem Zwischenspeicher
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.pfad }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Abhaengigkeiten installieren
        working-directory: frontend
        env:
          # Dieselbe Begruendung wie im Kopf von frontend/Dockerfile: pnpm
          # weist sonst jedes Paket ab, das juenger als 24 Stunden ist, und
          # der Lauf schluege nach jeder Aktualisierung einen Tag lang fehl.
          # Der Schutz zielt auf das Aufloesen neuer Versionen, und das
          # findet hier nicht statt: das Lockfile ist eingefroren und bringt
          # seine Pruefsummen mit.
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
        run: pnpm install --frozen-lockfile

      - name: Tests
        working-directory: frontend
        run: pnpm test

      - name: Typen pruefen
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Bauen
        working-directory: frontend
        run: pnpm build

  # ======================================================================
  # tests (Gate)
  # ======================================================================
  # Fasst die beiden Testjobs zu EINEM Ergebnis zusammen. Das ist der Check,
  # auf den der Branch-Schutz von main zeigt, und deshalb heisst er weiterhin
  # "Tests": eine bestehende Regel muss durch den Umbau aus KAN-102 nicht
  # angefasst werden.
  #
  # ================= DIE FALLE, DERENTWEGEN ES DIESEN JOB GIBT =============
  # "if: always()" ist hier KEIN Schoenheitsfehler, sondern der Kern.
  #
  # Ohne die Zeile gilt die Vorgabe: ein Job mit needs laeuft nur, wenn alle
  # Abhaengigkeiten erfolgreich waren. Faellt backend-tests um, wird dieser
  # Job also nicht ROT, sondern UEBERSPRUNGEN. Und ein uebersprungener
  # Pflicht-Check gilt dem Branch-Schutz als bestanden. Ergebnis waere ein
  # roter Pull Request, der sich mergen laesst, und bei main gleich prod ist
  # das genau der Fehler, gegen den KAN-101 gebaut wurde.
  #
  # Mit always() laeuft der Job immer und entscheidet selbst. Akzeptiert wird
  # ausschliesslich "success": "skipped" und "cancelled" sind ausdruecklich
  # KEIN Erfolg, sonst haette man sich die Falle nur eine Ebene tiefer wieder
  # eingebaut.
  # =========================================================================
  tests:
    name: Tests
    needs: [backend-tests, frontend-tests]
    # Beim Rollback sind beide Testjobs uebersprungen, und uebersprungen ist
    # hier ausdruecklich kein Erfolg. Damit der Rollback-Lauf nicht an seinem
    # eigenen Gate rot wird, laeuft das Gate dort gar nicht; einen Pull
    # Request, den es schuetzen muesste, gibt es bei workflow_dispatch nicht.
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ergebnisse der Teiljobs pruefen
        env:
          BACKEND: ${{ needs.backend-tests.result }}
          FRONTEND: ${{ needs.frontend-tests.result }}
        run: |
          echo "backend-tests:  $BACKEND"
          echo "frontend-tests: $FRONTEND"

          fehler=0
          for paar in "Backend:$BACKEND" "Frontend:$FRONTEND"; do
            name="${paar%%:*}"
            wert="${paar#*:}"
            if [ "$wert" != "success" ]; then
              echo "$name ist nicht gruen (Ergebnis: $wert)." >&2
              fehler=1
            fi
          done
          exit "$fehler"

  # ======================================================================
  # build-backend und build-frontend
  # ======================================================================
  # Zwei Jobs statt zweier Schritte in einem: die Images wissen nichts
  # voneinander, und nebeneinander dauert der Bau so lange wie der laengere
  # der beiden statt so lange wie ihre Summe (im Lauf 34700332110 brauchten
  # sie nacheinander 3:55 und 2:00).
  #
  # Beide tragen "if" OHNE Statusfunktion. GitHub ergaenzt dort von selbst ein
  # success(), die Jobs laufen also weiterhin nur nach gruenem Gate. Wer hier
  # spaeter always() einsetzt, hebelt den Riegel aus.
  build-backend:
    name: Backend-Image bauen und schieben
    needs: [tests, marke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Der Digest des geschobenen Images geht an deploy (KAN-106): auf dem
    # Server wird nach dem Ziehen geprueft, dass unter der Marke genau dieses
    # Image liegt, und nicht irgendeines, das zufaellig denselben Namen traegt.
    outputs:
      digest: ${{ steps.bauen.outputs.digest }}

    permissions:
      contents: read
      # Nur hier und in build-frontend: allein diese beiden Jobs schreiben in
      # die Registry. Der VPS bekommt niemals ein Token mit Schreibrechten, er
      # liest mit einem PAT, das ausschliesslich read:packages traegt.
      packages: write

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: An GHCR anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Das eingebaute Token des Laufs, kein hinterlegtes Geheimnis. Es
          # gilt nur fuer diesen Lauf und traegt genau die Rechte, die oben
          # unter permissions stehen.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und schieben
        id: bauen
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          # Ausdruecklich die Stufe runtime: das schlanke JRE-Image mit dem
          # fertigen Jar. Ohne target baute Docker die letzte Stufe des
          # Dockerfiles, was hier zwar dieselbe waere, aber nur zufaellig.
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/eportfolio-backend:${{ needs.marke.outputs.image_tag }}
            ${{ env.IMAGE_NAMESPACE }}/eportfolio-backend:main
          # Eigener scope je Dienst. Mit einem gemeinsamen Zwischenspeicher
          # verdraengen Backend und Frontend einander, und jeder Lauf dauert
          # so lange wie der erste; seit sie parallel laufen, wuerden sie sich
          # ausserdem gegenseitig den Eintrag ueberschreiben. Der Bau braeche
          # davon nicht ab, er waere nur jedes Mal wieder kalt.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          # Keine Provenance- und SBOM-Anhaenge (KAN-106). Mit ihnen schiebt
          # buildx statt eines einzelnen Manifests einen Index, und der
          # Digest, den diese Action meldet, ist dann der des Index. Ohne sie
          # ist er der des Manifests, also genau der Eintrag, den das Image
          # nach "docker pull" in RepoDigests traegt. deploy/ausrollen.sh
          # vergleicht beide; der Vergleich soll nicht daran haengen, wie
          # Docker einen Index verbucht. Gebraucht werden die Anhaenge hier
          # nicht.
          provenance: false
          sbom: false

  build-frontend:
    name: Frontend-Image bauen und schieben
    needs: [tests, marke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Siehe build-backend.
    outputs:
      digest: ${{ steps.bauen.outputs.digest }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: An GHCR anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und schieben
        id: bauen
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/eportfolio-frontend:${{ needs.marke.outputs.image_tag }}
            ${{ env.IMAGE_NAMESPACE }}/eportfolio-frontend:main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          # Siehe build-backend.
          provenance: false
          sbom: false
          # DIE VIER ANGABEN DES IMPRESSUMS (KAN-100) MUESSEN HIER STEHEN.
          #
          # Vite backt sie beim Buendeln in die JS-Dateien ein; die Stufe
          # runtime ist ein nginx, der fertige Dateien ausliefert. Dieser Bau
          # ist also der einzige Zeitpunkt, an dem der Wert ankommen kann.
          # Solange auf dem VPS gebaut wurde, kamen sie aus der dortigen .env.
          # Sobald das Image hier entsteht, sieht es diese Datei nie, und ohne
          # die vier Zeilen stuende das Impressum auf PROD leer da: kein
          # Abbruch, nur eine Seite, die sichtbar sagt, dass die Angaben
          # fehlen. Genau der Zustand, den KAN-100 beseitigt hat.
          #
          # Als Secrets und nicht als Variablen, obwohl die Anschrift auf der
          # fertigen Seite oeffentlich steht: so bleibt sie in den Logs
          # maskiert und kann nicht versehentlich in eine Ausgabe geraten.
          # Die Server-.env behaelt die vier Werte trotzdem, sie werden fuer
          # den Notweg aus docs/SETUP.md Abschnitt 10 gebraucht.
          build-args: |
            VITE_IMPRINT_OPERATOR=${{ secrets.VITE_IMPRINT_OPERATOR }}
            VITE_IMPRINT_STREET=${{ secrets.VITE_IMPRINT_STREET }}
            VITE_IMPRINT_CITY=${{ secrets.VITE_IMPRINT_CITY }}
            VITE_IMPRINT_EMAIL=${{ secrets.VITE_IMPRINT_EMAIL }}

  # ======================================================================
  # deploy
  # ======================================================================
  deploy:
    name: Auf dem VPS ausrollen
    needs: [marke, build-backend, build-frontend]
    # Zwei Wege hinein, und keiner davon fuehrt an den Tests vorbei:
    #
    #   push auf main       beide Build-Jobs muessen gruen sein, und die
    #                       laufen nur nach gruenem Gate.
    #   workflow_dispatch   von Hand gestartet, mit einer frueher ueber main
    #                       gebauten Marke (Rollback). Tests und Bau sind
    #                       uebersprungen; ausgerollt wird nur auf main.
    #
    # "!cancelled()" statt einer Zeile ohne Statusfunktion: ohne eine solche
    # ergaenzt GitHub success(), und der Job liefe nach uebersprungenen
    # Build-Jobs gar nicht, also nie beim Rollback. "always()" liefe dagegen
    # auch nach einem Abbruch des Laufs noch los; "!cancelled()" nicht. Die
    # Ergebnisse der Vorgaenger werden deshalb ausdruecklich geprueft, und
    # "skipped" oder "failure" sind kein Erfolg.
    if: >-
      ${{ !cancelled()
          && needs.marke.result == 'success'
          && (
            (github.event_name == 'push'
              && needs.build-backend.result == 'success'
              && needs.build-frontend.result == 'success')
            || (github.event_name == 'workflow_dispatch'
              && github.ref == 'refs/heads/main')
          ) }}
    runs-on: ubuntu-latest
    # Der Fernteil wartet bis zu fuenf Minuten auf die Gesundheitspruefungen
    # und danach bis zu zwei Minuten je Probe auf die Seite von aussen (zwei
    # Proben); Sicherung, Fetch und Ziehen kosten Sekunden bis wenige Minuten.
    # Bleibt der Job darueber hinaus stehen, haengt die SSH-Verbindung, und
    # dann ist Abbrechen besser als Warten.
    timeout-minutes: 25

    steps:
      # Nur das Verzeichnis deploy/, nicht das ganze Repository: der Job
      # braucht allein das Skript, das er an den Server schickt. Es kommt
      # aus dem Checkout zu github.sha: nach einem Merge ist das der Commit,
      # dessen Images gebaut wurden; beim Rollback der Stand von main beim
      # Start, waehrend die Images aelter sind (docs/SETUP.md Abschnitt 10,
      # Rollback). Welche Fassung im Checkout auf dem Server liegt, spielt
      # keine Rolle, das Skript zieht ihn selbst auf denselben Commit.
      - name: Ausroll-Skript holen
        uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Ausroll-Skript auf Syntaxfehler pruefen
        run: bash -n deploy/ausrollen.sh

      - name: SSH-Zugang einrichten
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Der oeffentliche Wirtsschluessel des Servers, hinterlegt als
          # viertes Secret. Ohne ihn bliebe nur StrictHostKeyChecking=no, und
          # damit wuerde die Action jeden Rechner akzeptieren, der sich
          # zwischen GitHub und den VPS setzt. Wie er zu beschaffen ist, steht
          # in docs/SETUP.md Abschnitt 10.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ausrollen
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          # Fest und KEIN Secret mehr (KAN-106). GitHub ersetzt jeden Wert eines
          # benutzten Secrets im Protokoll durch ***, und mit "deploy" als Secret
          # stand in jeder Meldung des Fernteils *** statt deploy: in "chown -R
          # ***:*** /opt/eportfolio", in "gehoert root, nicht ***", sogar im
          # Pfad ***/ausrollen.sh. Die Behebungsbefehle, die das Skript
          # absichtlich in seine Meldungen schreibt, waren damit unlesbar. Der
          # Name ist kein Geheimnis: das Skript verlangt ohnehin einen
          # Nicht-root-Nutzer, und die Einrichtung legt ihn auf deploy fest.
          # Geheim bleibt allein der Hostname.
          VPS_USER: deploy
          IMAGE_TAG: ${{ needs.marke.outputs.image_tag }}
          # Der Commit, dessen compose.*.yml und Caddyfile auf dem Server
          # liegen muessen: bei push der Merge-Commit, beim Rollback der
          # Stand von main, von dem aus der Lauf gestartet wurde.
          COMMIT: ${{ github.sha }}
          TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'push' }}
          # Leer beim Rollback, dort gab es keinen Bau; das Skript prueft
          # dann gegen die Registry statt gegen den Bau dieses Laufs.
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.build-frontend.outputs.digest }}
        run: |
          # Der Hostname steht ausdruecklich als Secret und nicht im Workflow:
          # ein oeffentlich gewordener Workflow soll nicht die Serveradresse
          # mitliefern.
          #
          # BatchMode verhindert die Passwortabfrage, nicht das Haengen. Ohne
          # die drei Zeitwerte kann eine tote Verbindung bis zum Job-Limit
          # stehen bleiben, und weil cancel-in-progress fuer Pushes bewusst
          # aus ist, wartet jeder folgende Merge in derselben
          # Concurrency-Gruppe mit.
          #
          # Das Skript geht ueber die Standardeingabe ("bash -s"), die fuenf
          # Werte ueber die Befehlszeile davor. Sie sind vorher geprueft (die
          # Marke im Job marke, der Rest sind Hashes der Actions und feste
          # Woerter); die einfachen Anfuehrungszeichen halten sie trotzdem
          # zusammen. Was das Skript auf dem Server tut und warum in dieser
          # Reihenfolge, steht im Kopf von deploy/ausrollen.sh.
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              "${VPS_USER}@${VPS_HOST}" \
              "IMAGE_TAG='${IMAGE_TAG}' COMMIT='${COMMIT}' TRIGGER='${TRIGGER}' BACKEND_DIGEST='${BACKEND_DIGEST}' FRONTEND_DIGEST='${FRONTEND_DIGEST}' bash -s" \
              < deploy/ausrollen.sh

      - name: Schluessel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
